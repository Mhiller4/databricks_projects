# Care Finder, end to end:
#   Delta Share -> bronze (as received) -> DQ profile -> auto-clean silver -> DQ profile
#   -> facility_master -> location lookup / service evidence / trust -> index + SQL functions -> demo + Parquet export
#   -> facilities_curated -> facilities_clean (silver/18)
# Step 1 of hc_full_refresh (then hc_ai_review, then hc_confidence_model).
#
#   databricks bundle run hc_care_finder -t free --profile <p>        (~10 min)
#
# The share tables are a job-parameter default, so no --params are needed. (To override
# source_tables, use `databricks jobs run-now --json`: `bundle run --params` can't pass commas.)

resources:
  jobs:
    hc_care_finder:
      name: hc_care_finder
      max_concurrent_runs: 1
      tags:
        project: care_finder

      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: bronze_schema
          default: ${var.bronze_schema}
        - name: silver_schema
          default: ${var.silver_schema}
        - name: gold_schema
          default: ${var.gold_schema}
        - name: landing_volume
          default: ${var.landing_volume}
        - name: source_tables
          default: ${var.share}.facilities,${var.share}.india_post_pincode_directory,${var.share}.nfhs_5_district_health_indicators
        - name: table_prefix
          default: vf_
        - name: subfolder
          default: kickoff   # only used when source_tables is blank (files in the landing volume)
        - name: overrides_json
          default: "{}"

      tasks:
        # ---- bronze + silver: copy the share, profile it, clean it
        - task_key: setup
          notebook_task:
            notebook_path: ../notebooks/00_setup/create_schemas_and_volume.py

        - task_key: ingest_bronze
          depends_on: [{ task_key: setup }]
          notebook_task:
            notebook_path: ../notebooks/bronze/01_ingest_kickoff_data.py

        - task_key: profile_bronze
          depends_on: [{ task_key: ingest_bronze }]
          notebook_task:
            notebook_path: ../notebooks/silver/10_profile_tables.py
            base_parameters:
              layer: bronze
              name_like: "{{job.parameters.table_prefix}}*"

        - task_key: clean_silver
          depends_on: [{ task_key: ingest_bronze }]
          notebook_task:
            notebook_path: ../notebooks/silver/11_clean_kickoff_tables.py

        - task_key: profile_silver
          depends_on: [{ task_key: clean_silver }, { task_key: profile_bronze }]
          notebook_task:
            notebook_path: ../notebooks/silver/10_profile_tables.py
            base_parameters:
              layer: silver
              name_like: "{{job.parameters.table_prefix}}*"

        # ---- external sources (files at the top of the landing volume) -> hc_bronze.ext_*
        - task_key: ingest_external
          depends_on: [{ task_key: setup }]
          notebook_task:
            notebook_path: ../notebooks/bronze/02_ingest_external_files.py

        - task_key: profile_external
          depends_on: [{ task_key: ingest_external }]
          notebook_task:
            notebook_path: ../notebooks/silver/10_profile_tables.py
            base_parameters:
              layer: bronze
              name_like: "ext_*"

        - task_key: silver_hospital_directory
          depends_on: [{ task_key: ingest_external }]
          notebook_task:
            notebook_path: ../notebooks/silver/13_ext_hospital_directory.py

        - task_key: silver_district_boundaries
          depends_on: [{ task_key: ingest_external }]
          notebook_task:
            notebook_path: ../notebooks/silver/14_district_boundaries.py

        - task_key: silver_pmjay
          depends_on: [{ task_key: ingest_external }]
          notebook_task:
            notebook_path: ../notebooks/silver/15_ext_pmjay.py

        - task_key: silver_ihds
          depends_on: [{ task_key: ingest_external }]
          notebook_task:
            notebook_path: ../notebooks/silver/16_ext_ihds.py

        # ---- Care Finder
        - task_key: facility_master
          depends_on: [{ task_key: clean_silver }]
          notebook_task:
            notebook_path: ../notebooks/silver/12_facility_master.py

        - task_key: location_lookup
          depends_on: [{ task_key: facility_master }]
          notebook_task:
            notebook_path: ../notebooks/gold/20_location_lookup.py

        - task_key: service_evidence
          depends_on: [{ task_key: facility_master }]
          notebook_task:
            notebook_path: ../notebooks/gold/21_service_evidence.py

        - task_key: external_corroboration
          depends_on: [{ task_key: facility_master }, { task_key: silver_hospital_directory }, { task_key: location_lookup }]
          notebook_task:
            notebook_path: ../notebooks/gold/27_external_corroboration.py

        - task_key: facility_districts
          depends_on: [{ task_key: facility_master }, { task_key: silver_district_boundaries }]
          notebook_task:
            notebook_path: ../notebooks/gold/26_facility_districts.py

        - task_key: facility_trust
          depends_on: [{ task_key: facility_master }, { task_key: external_corroboration }]
          notebook_task:
            notebook_path: ../notebooks/gold/22_facility_trust.py

        - task_key: index_and_functions
          depends_on: [{ task_key: location_lookup }, { task_key: service_evidence }, { task_key: facility_trust }]
          notebook_task:
            notebook_path: ../notebooks/gold/23_care_finder_index.py

        - task_key: district_coverage
          depends_on: [{ task_key: index_and_functions }, { task_key: facility_districts }, { task_key: external_corroboration }]
          notebook_task:
            notebook_path: ../notebooks/gold/28_district_coverage.py

        - task_key: pmjay_demand
          depends_on: [{ task_key: index_and_functions }, { task_key: silver_pmjay }]
          notebook_task:
            notebook_path: ../notebooks/gold/29_pmjay_demand.py

        - task_key: ihds_base_rates
          depends_on: [{ task_key: silver_ihds }]
          notebook_task:
            notebook_path: ../notebooks/gold/31_ihds_base_rates.py

        - task_key: facilities_curated
          depends_on: [{ task_key: index_and_functions }, { task_key: facility_districts }, { task_key: external_corroboration }, { task_key: silver_ihds }]
          notebook_task:
            notebook_path: ../notebooks/silver/17_facilities_curated.py

        # Bryce's cleaning pass: canonical service labels, checked coordinates, doctors/beds, census population
        - task_key: facilities_clean
          depends_on: [{ task_key: facilities_curated }]
          notebook_task:
            notebook_path: ../notebooks/silver/18_facilities_clean.py

        - task_key: export_serving
          depends_on: [{ task_key: index_and_functions }]
          notebook_task:
            notebook_path: ../notebooks/gold/25_export_serving.py

        - task_key: demo
          depends_on: [{ task_key: index_and_functions }]
          notebook_task:
            notebook_path: ../notebooks/gold/24_care_finder_demo.py
