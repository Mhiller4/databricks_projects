# Care Finder build: facility master -> location lookup -> service evidence -> trust -> index + SQL functions -> demo.
# Run after hc_kickoff has loaded the vf_* tables:
#   databricks bundle run hc_care_finder -t free --profile <p>

resources:
  jobs:
    hc_care_finder:
      name: hc_care_finder
      max_concurrent_runs: 1
      tags:
        project: hc_datathon
        layer: gold

      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: bronze_schema
          default: ${var.bronze_schema}
        - name: silver_schema
          default: ${var.silver_schema}
        - name: gold_schema
          default: ${var.gold_schema}
        - name: landing_volume
          default: ${var.landing_volume}

      tasks:
        - task_key: facility_master
          notebook_task:
            notebook_path: ../notebooks/silver/13_facility_master.py

        - task_key: location_lookup
          depends_on: [{ task_key: facility_master }]
          notebook_task:
            notebook_path: ../notebooks/gold/40_location_lookup.py

        - task_key: service_evidence
          depends_on: [{ task_key: facility_master }]
          notebook_task:
            notebook_path: ../notebooks/gold/41_service_evidence.py

        - task_key: facility_trust
          depends_on: [{ task_key: facility_master }]
          notebook_task:
            notebook_path: ../notebooks/gold/42_facility_trust.py

        - task_key: index_and_functions
          depends_on: [{ task_key: location_lookup }, { task_key: service_evidence }, { task_key: facility_trust }]
          notebook_task:
            notebook_path: ../notebooks/gold/43_care_finder_index.py

        - task_key: demo
          depends_on: [{ task_key: index_and_functions }]
          notebook_task:
            notebook_path: ../notebooks/gold/44_care_finder_demo.py
