# Confidence for every facility x service pair, and what the app and planners read:
#
#   llm_labels (gold/32: 1,200 random + 200 risk-selected pairs, Llama 3.3 70B, resumable)
#     \-- capability_model (gold/44)   text features + LightGBM; final band = average of rules and model, rounded up
#            |-- gap_analysis (gold/42)  district x service access gaps and NFHS-5 need
#            \-- find_care (gold/43)     find_care() table function over care_finder_index_final
#
#   databricks bundle run hc_confidence_model -t free --profile <p>
#   skip the labelling step:  ... --only capability_model,gap_analysis,find_care
#
# Step 3 of hc_full_refresh. Needs hc_gold.care_finder_index_v2 and llm_review from hc_ai_review (gold/40).
# gold/41 is deliberately in no job: it would overwrite hc_gold.facility_external_matches (gold/27).
# Design notes and results: docs/CONFIDENCE_MODEL_SPEC.md

resources:
  jobs:
    hc_confidence_model:
      name: hc_confidence_model
      max_concurrent_runs: 1
      tags:
        project: care_finder
        layer: gold

      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: bronze_schema
          default: ${var.bronze_schema}
        - name: silver_schema
          default: ${var.silver_schema}
        - name: gold_schema
          default: ${var.gold_schema}
        - name: landing_volume
          default: ${var.landing_volume}

      tasks:
        - task_key: llm_labels
          notebook_task:
            notebook_path: ../notebooks/gold/32_llm_labels.py

        - task_key: capability_model
          depends_on: [{ task_key: llm_labels }]
          notebook_task:
            notebook_path: ../notebooks/gold/44_capability_model.py

        - task_key: gap_analysis
          depends_on: [{ task_key: capability_model }]
          notebook_task:
            notebook_path: ../notebooks/gold/42_gap_analysis.py

        - task_key: find_care
          depends_on: [{ task_key: capability_model }]
          notebook_task:
            notebook_path: ../notebooks/gold/43_find_care.py
