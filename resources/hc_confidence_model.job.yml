# Confidence for every facility x service pair (docs/CONFIDENCE_MODEL_SPEC.md + notebooks/find_the_right_care):
#
#   llm_labels (gold/32: 1,200 random + 200 risk-selected pairs, Llama 3.3 70B, resumable)
#     |-- features (gold/33) --> train (gold/30 template)         research: our tabular model, rules vs model report
#     |                      \-> score (gold/34)
#     \-- capability_model (find_the_right_care/06)             the score the app uses: text features + LightGBM,
#            |                                                  final band = average of rules and model, rounded up
#            |-- gap_analysis (04)  district x service access gaps and NFHS-5 need
#            \-- serving (05)       find_care() table function over care_finder_index_final
#
#   databricks bundle run hc_confidence_model -t free --profile <p>
#   only the app path:  ... --only capability_model,gap_analysis,serving
#
# Needs hc_gold.care_finder_index_v2 from job hc_ai_review (find_the_right_care/02) to exist.
# find_the_right_care/03 is deliberately in no job: it would overwrite hc_gold.facility_external_matches (gold/27).
# Job-level parameters are pushed to every task and override base_parameters, so only the shared
# catalog / schema values live here; per-task values (source_table, register_as, ...) are task-level.

resources:
  jobs:
    hc_confidence_model:
      name: hc_confidence_model
      max_concurrent_runs: 1
      tags:
        project: care_finder
        layer: gold

      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: bronze_schema
          default: ${var.bronze_schema}
        - name: silver_schema
          default: ${var.silver_schema}
        - name: gold_schema
          default: ${var.gold_schema}
        - name: landing_volume
          default: ${var.landing_volume}

      tasks:
        - task_key: llm_labels
          notebook_task:
            notebook_path: ../notebooks/gold/32_llm_labels.py

        # ---- research path: tabular model vs the rules
        - task_key: features
          depends_on: [{ task_key: llm_labels }]
          notebook_task:
            notebook_path: ../notebooks/gold/33_confidence_features.py

        - task_key: train
          depends_on: [{ task_key: features }]
          notebook_task:
            notebook_path: ../notebooks/gold/30_model_template.py
            base_parameters:
              source_table: confidence_training
              target_col: label
              task: binary
              group_col: facility_id
              id_cols: facility_id
              n_folds: "5"
              run_name: confidence_training__label

        - task_key: score
          depends_on: [{ task_key: features }]
          notebook_task:
            notebook_path: ../notebooks/gold/34_confidence_model.py
            base_parameters:
              register_as: care_finder_confidence

        # ---- app path: capability model -> final index -> gap analysis + find_care()
        - task_key: capability_model
          depends_on: [{ task_key: llm_labels }]
          notebook_task:
            notebook_path: ../notebooks/find_the_right_care/06_train_model.py

        - task_key: gap_analysis
          depends_on: [{ task_key: capability_model }]
          notebook_task:
            notebook_path: ../notebooks/find_the_right_care/04_gap_analysis.py

        - task_key: serving
          depends_on: [{ task_key: capability_model }]
          notebook_task:
            notebook_path: ../notebooks/find_the_right_care/05_serving.py
