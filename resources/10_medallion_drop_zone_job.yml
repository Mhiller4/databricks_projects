# Medallion example: drop-zone stage.
# This job demonstrates landing validation and initial file registration patterns.

resources:
  jobs:
    template_medallion_drop_zone_job:
      name: template_medallion_drop_zone_job

      tags:
        template: true
        architecture: medallion
        layer: drop_zone

      # Schedule example: disabled by default for templates.
      schedule:
        quartz_cron_expression: "0 0 6 ? * MON-FRI *"
        timezone_id: "UTC"
        pause_status: "PAUSED"

      parameters:
        - name: catalog
          default: ${var.catalog_name}
        - name: drop_zone_schema
          default: ${resources.schemas.template_drop_zone.name}
        - name: drop_zone_volume
          default: ${var.drop_zone_volume}

      tasks:
        - task_key: validate_incoming_files
          notebook_task:
            notebook_path: ../notebooks/medallion_example/drop_zone/validate_and_register.py
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              drop_zone_schema: "{{job.parameters.drop_zone_schema}}"
              drop_zone_volume: "{{job.parameters.drop_zone_volume}}"
          environment_key: default

      environments:
        - environment_key: default
          spec:
            client: "2"
