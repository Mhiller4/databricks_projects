# Model template job: any table + target -> dummy / linear / LightGBM -> SHAP -> MLflow -> gold decision tables.
# No default table: pass source_table and target_col, e.g.
#   databricks bundle run hc_model -t free --profile <p> \
#     --params source_table=<gold table>,target_col=<col>,id_cols=<ids>,exclude_cols=<leaky globs>,group_col=<col or blank>

resources:
  jobs:
    hc_model:
      name: hc_model
      max_concurrent_runs: 2
      tags:
        project: care_finder
        layer: gold

      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: bronze_schema
          default: ${var.bronze_schema}
        - name: silver_schema
          default: ${var.silver_schema}
        - name: gold_schema
          default: ${var.gold_schema}
        - name: landing_volume
          default: ${var.landing_volume}
        - name: source_table
          default: ""
        - name: target_col
          default: ""
        - name: task
          default: auto
        - name: positive_class
          default: ""
        - name: id_cols
          default: ""
        - name: exclude_cols
          default: ""
        - name: group_col
          default: ""
        - name: test_size
          default: "0.2"
        - name: n_folds
          default: "5"
        - name: max_rows
          default: "500000"
        - name: run_name
          default: ""
        - name: experiment
          default: ""
        - name: register_as
          default: ""

      tasks:
        - task_key: train
          notebook_task:
            notebook_path: ../notebooks/gold/30_model_template.py
