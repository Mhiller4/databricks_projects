# Model template job: any table + target -> dummy / linear / LightGBM -> SHAP -> MLflow -> gold decision tables.
# Defaults run the pre-kickoff county overdose "higher than expected" model. Point it elsewhere with:
#   databricks bundle run hc_model -t free --profile <p> \
#     --params source_table=kickoff_encounters_with_county,target_col=readmitted_30d,id_cols=encounter_id,group_col=patient_id,exclude_cols=

resources:
  jobs:
    hc_model:
      name: hc_model
      max_concurrent_runs: 2
      tags:
        project: hc_datathon
        layer: gold

      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: bronze_schema
          default: ${var.bronze_schema}
        - name: silver_schema
          default: ${var.silver_schema}
        - name: gold_schema
          default: ${var.gold_schema}
        - name: landing_volume
          default: ${var.landing_volume}
        - name: source_table
          default: county_context
        - name: target_col
          default: overdose_deaths_per_100k
        - name: task
          default: auto
        - name: positive_class
          default: ""
        - name: id_cols
          default: fips,state_abbr,state_name,county_name
        - name: exclude_cols
          default: overdose_*,rucc_description
        - name: group_col
          default: state_abbr
        - name: test_size
          default: "0.2"
        - name: n_folds
          default: "5"
        - name: max_rows
          default: "500000"
        - name: run_name
          default: ""
        - name: experiment
          default: ""
        - name: register_as
          default: ""

      tasks:
        - task_key: train
          notebook_task:
            notebook_path: ../notebooks/gold/30_model_template.py
