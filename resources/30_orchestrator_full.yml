# Full orchestration example.
#
# Demonstrates run_job_task linking across multiple jobs.
# This is often the cleanest way to keep each layer job modular while still enabling
# an end-to-end schedule from one entry point.

resources:
  jobs:
    template_orchestrator_full:
      name: template_orchestrator_full

      tags:
        template: true
        layer: orchestrator

      max_concurrent_runs: 1

      # Example cadence for an end-to-end refresh.
      schedule:
        quartz_cron_expression: "0 0 2 ? * SUN *"
        timezone_id: "UTC"
        pause_status: "PAUSED"

      tasks:
        - task_key: start
          notebook_task:
            notebook_path: ../notebooks/utils/orchestrator_start.py
          environment_key: default

        - task_key: drop_zone
          depends_on:
            - task_key: start 
            # this is an additional job that has a dependency on the orchestrator start task. 
          run_job_task:
            job_id: ${resources.jobs.template_medallion_drop_zone_job.id}

        - task_key: raw
          depends_on:
            - task_key: drop_zone
          run_job_task:
            job_id: ${resources.jobs.template_medallion_raw_job.id}

        - task_key: enriched
          depends_on:
            - task_key: raw
          run_job_task:
            job_id: ${resources.jobs.template_medallion_enriched_job.id}

        - task_key: curated
          depends_on:
            - task_key: enriched
          run_job_task:
            job_id: ${resources.jobs.template_medallion_curated_job.id}

        - task_key: non_medallion
          depends_on:
            - task_key: curated
          run_job_task:
            job_id: ${resources.jobs.template_non_medallion_reverse_etl_job.id}

        - task_key: end
          depends_on:
            - task_key: non_medallion
          notebook_task:
            notebook_path: ../notebooks/utils/orchestrator_end.py
          environment_key: default

      environments:
        - environment_key: default
          spec:
            client: "2"
