# Medallion example: raw (bronze) stage.
# This demonstrates a task that reads landing assets and writes raw tables.

resources:
  jobs:
    template_medallion_raw_job:
      name: template_medallion_raw_job

      tags:
        template: true
        architecture: medallion
        layer: raw

      parameters:
        - name: catalog
          default: ${var.catalog_name}
        - name: drop_zone_schema
          default: ${resources.schemas.template_drop_zone.name}
        - name: drop_zone_volume
          default: ${var.drop_zone_volume}
        - name: raw_schema
          default: ${resources.schemas.template_raw.name}

      tasks:
        - task_key: ingest_to_raw
          notebook_task:
            notebook_path: ../notebooks/medallion_example/raw/ingest_orders_raw.py
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              drop_zone_schema: "{{job.parameters.drop_zone_schema}}"
              drop_zone_volume: "{{job.parameters.drop_zone_volume}}"
              raw_schema: "{{job.parameters.raw_schema}}"
          environment_key: default

      environments:
        - environment_key: default
          spec:
            client: "2"
