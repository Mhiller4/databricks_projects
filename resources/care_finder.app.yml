# Care Finder web app + API + voice worker, as one Databricks App.
# Build first:  scripts/build_app.sh
# Deploy/start: databricks bundle deploy -t free --profile <p> && databricks bundle run care_finder -t free --profile <p>
# Secrets: scope `care-finder` (livekit-api-key, livekit-api-secret, google-api-key), created by the user.

resources:
  apps:
    care_finder:
      name: ${var.app_name}
      description: "Care Finder: find the right care in India (voice, chat, search)"
      source_code_path: ../build/care_finder_app
      resources:
        - name: serving-volume
          uc_securable:
            securable_full_name: ${var.catalog}.${var.gold_schema}.serving
            securable_type: VOLUME
            permission: READ_VOLUME
        - name: livekit-api-key
          secret:
            scope: care-finder
            key: livekit-api-key
            permission: READ
        - name: livekit-api-secret
          secret:
            scope: care-finder
            key: livekit-api-secret
            permission: READ
        - name: google-api-key
          secret:
            scope: care-finder
            key: google-api-key
            permission: READ
