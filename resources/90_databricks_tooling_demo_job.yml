# Tooling/demo job for team onboarding.
# This notebook is intentionally not linked into the production flow.

resources:
  jobs:
    template_databricks_tooling_demo_job:
      name: template_databricks_tooling_demo_job

      tags:
        template: true
        purpose: learning

      parameters:
        - name: catalog
          default: ${var.catalog_name}

      tasks:
        - task_key: databricks_crash_course
          notebook_task:
            notebook_path: ../notebooks/tooling_demo/databricks_crash_course.py
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
          environment_key: default

      environments:
        - environment_key: default
          spec:
            client: "2"
