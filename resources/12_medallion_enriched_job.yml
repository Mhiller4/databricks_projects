# Medallion example: enriched (silver) stage.
# Demonstrates an incremental merge-style task.

resources:
  jobs:
    template_medallion_enriched_job:
      name: template_medallion_enriched_job

      tags:
        template: true
        architecture: medallion
        layer: enriched

      parameters:
        - name: catalog
          default: ${var.catalog_name}
        - name: raw_schema
          default: ${resources.schemas.template_raw.name}
        - name: enriched_schema
          default: ${resources.schemas.template_enriched.name}

      tasks:
        - task_key: merge_to_enriched
          notebook_task:
            notebook_path: ../notebooks/medallion_example/enriched/merge_orders_enriched.py
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              raw_schema: "{{job.parameters.raw_schema}}"
              enriched_schema: "{{job.parameters.enriched_schema}}"
          environment_key: default

      environments:
        - environment_key: default
          spec:
            client: "2"
