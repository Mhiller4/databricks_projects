# Foundational Unity Catalog objects for this template bundle.
# Keep this separate so object provisioning is easy to review.

resources:
  schemas:
    template_drop_zone:
      catalog_name: ${var.catalog_name}
      name: ${var.drop_zone_schema}
      comment: "Landing schema for incoming files"

    template_raw:
      catalog_name: ${var.catalog_name}
      name: ${var.raw_schema}
      comment: "Raw/bronze schema for minimally transformed data"

    template_enriched:
      catalog_name: ${var.catalog_name}
      name: ${var.enriched_schema}
      comment: "Enriched/silver schema for business-ready tables"

    template_curated:
      catalog_name: ${var.catalog_name}
      name: ${var.curated_schema}
      comment: "Curated/gold schema for reporting outputs"

  volumes:
    template_landing:
      catalog_name: ${var.catalog_name}
      schema_name: ${resources.schemas.template_drop_zone.name}
      name: ${var.drop_zone_volume}
      volume_type: MANAGED
      comment: "Landing volume used by medallion drop-zone example"
