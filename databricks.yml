# Healthcare Datathon bundle
#
# Deploy:   databricks bundle deploy -t free --profile <your-profile>
# Run:      databricks bundle run hc_public_sources -t free --profile <your-profile>
#           databricks bundle run hc_kickoff -t free --profile <your-profile>
#
# Targets
#   free       Databricks Free Edition (default). Serverless only, catalog `workspace`.
#   hackathon  A workspace the organizers might provide. Change `catalog` (and host) there.
#
# Neither target pins a host: the --profile you pass decides the workspace, so each of us can
# deploy the same bundle to our own Free Edition workspace.
#
# Schemas/volume are NOT bundle resources. notebooks/00_setup creates them with IF NOT EXISTS, so
# `bundle destroy` never drops data and UI-only work sees the same layout.

bundle:
  name: hc_datathon

variables:
  catalog:
    description: Unity Catalog catalog (Free Edition ships with `workspace`)
    default: workspace
  bronze_schema:
    description: Raw tables as received
    default: hc_bronze
  silver_schema:
    description: Cleaned, typed, joinable tables
    default: hc_silver
  gold_schema:
    description: Analysis/model-ready tables, DQ scorecards, decision outputs
    default: hc_gold
  landing_volume:
    description: Managed volume (in bronze schema) for raw files
    default: landing

include:
  - resources/*.yml

targets:
  free:
    default: true
    mode: development # job names get a [dev <user>] prefix; schedules paused

  hackathon:
    mode: development
    # workspace:
    #   host: https://<organizer-workspace>.cloud.databricks.com
    variables:
      catalog: workspace # <- change to the catalog the organizers give us
